spring.application.name=stock-api-java
server.port=${PORT:8081}

# 資料庫連線全部由環境變數提供（IntelliJ：Run > Edit Configurations > Environment variables）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 資料表由 Python 擷取服務建立與維護；Java 啟動時只驗證結構，不建立也不修改
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 錯誤回應使用 RFC 9457 Problem Details 格式（含 detail 說明），例如找不到代號、日期格式錯誤
spring.mvc.problemdetails.enabled=true

# 允許跨網域呼叫的前端來源（Vite 開發伺服器預設 http://localhost:5173）
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Google 登入（OAuth 用戶端在 Google Cloud 建立）；未設定 GOOGLE_CLIENT_ID 時登入功能關閉，其餘 API 照常
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# 允許登入的 email，以逗號分隔；空白時任何人都無法登入
app.auth.allowed-emails=${AUTH_ALLOWED_EMAILS:}
# 登入成功 / 失敗後轉回的前端網址（開發時為 Vite，API 經由 Vite 轉發，與前端同一個來源）
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 登入狀態存在伺服器端 session：cookie 前端 JavaScript 讀不到（HttpOnly），只在同站請求送出
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# 閒置 12 小時後需重新登入（Java 重新啟動也需要重新登入）
server.servlet.session.timeout=12h
