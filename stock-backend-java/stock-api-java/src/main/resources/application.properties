spring.application.name=stock-api-java
server.port=${PORT:8081}

# 資料庫連線全部由環境變數提供（IntelliJ：Run > Edit Configurations > Environment variables）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 閒置 2 分鐘（毫秒）後關閉連線、不保留最少連線數（Neon 在沒有連線約 5 分鐘後休眠，不計算用量）；有請求時再建立，最多 5 條
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.maximum-pool-size=5

# 資料表由 Python 擷取服務建立與維護；Java 啟動時只驗證結構，不建立也不修改
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 錯誤回應使用 RFC 9457 Problem Details 格式（含 detail 說明），例如找不到代號、日期格式錯誤
spring.mvc.problemdetails.enabled=true

# 允許跨網域呼叫的前端來源（Vite 開發伺服器預設 http://localhost:5173）
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Google 登入（OAuth 用戶端在 Google Cloud 建立）；未設定 GOOGLE_CLIENT_ID 時登入功能關閉，其餘 API 照常
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# 允許登入的 email，以逗號分隔；空白時任何人都無法登入
app.auth.allowed-emails=${AUTH_ALLOWED_EMAILS:}
# 登入成功 / 失敗後轉回的前端網址（開發時為 Vite，API 經由 Vite 轉發，與前端同一個來源）；
# 部署後前端由 Java 一起提供，設為網站網址，或設為空白（轉回同一個網址下的路徑）
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 登入狀態存在伺服器端 session：cookie 前端 JavaScript 讀不到（HttpOnly），只在同站請求送出
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# 閒置 12 小時後需重新登入（Spring Session 不沿用 server.servlet.session.timeout，兩個都要設定）
server.servlet.session.timeout=12h
spring.session.timeout=12h
# session 存在資料庫（Spring Session JDBC），Java 重新啟動或部署後仍保持登入；資料表由 Python 建立
spring.session.jdbc.initialize-schema=never
# 每天清除一次過期的 session（預設每分鐘一次，會讓 Neon 無法休眠）；時間依 JVM 時區，Docker 映像設為 Asia/Taipei，
# 選在每日更新（15:00 起約 15 分鐘）之後，資料庫通常仍在運作
spring.session.jdbc.cleanup-cron=0 30 15 * * *

# ---- 部署 ----
# 前端（Vue build 後的檔案）由 Java 一起提供時，網頁與 API 同一個網址，壓縮後傳送以節省流量
server.compression.enabled=true
# 在 Render、Railway 等平台的反向代理之後：依代理附上的 X-Forwarded-* 取得使用者 IP 與 https（Google 登入的回呼網址需要）
server.forward-headers-strategy=native
# 每個 IP 每分鐘最多請求數（含網頁檔案），超過回 429，避免被大量存取造成流量超額；0 表示不限制
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:200}

# ---- 每日通知（Email）----
# 由 GitHub Actions 在每日更新後以「通知模式」執行一次（見 README「每日通知」）；網站本身不寄信
# Gmail：帳號需開啟兩步驟驗證並建立「應用程式密碼」；未設定 MAIL_USERNAME 時不會寄出
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# 寄件者顯示名稱（空白時為 EmailSender.DEFAULT_FROM_NAME）；properties 檔以 ISO-8859-1 讀取，中文值要寫在程式或環境變數中
app.notify.from-name=${MAIL_FROM_NAME:}
# 信件中「通知設定」連結的網站網址（尚未部署時空白，不附連結）
app.notify.site-url=${SITE_URL:}
# 通知模式：true 時啟動後寄出當天的通知就結束（--app.notify.run-once=true）；dry-run 只把內容寫進 log，不寄出
app.notify.run-once=false
app.notify.dry-run=false
