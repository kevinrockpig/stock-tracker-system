# 觀察名單與庫存中的股票每日更新（yfinance → 指標 → 策略 → 回測 → 交易計畫 → 參考價位），接著做資料健康檢查
#
# 與 official-daily.yml 一樣放在「私人 repo」的 .github/workflows/ 底下（執行紀錄會出現資料庫主機、持有的股票代號等資訊）。
# 取代 Mac 的每日排程（scripts/install_schedule.sh），電腦關機也會更新；先與 Mac 並行一週，確認 Yahoo 不會擋 GitHub 的連線再停用 Mac。
#
# 流程：取出公開 repo（程式碼）→ 安裝套件 → python -m scraper.main → python -m scraper.health
# 需要的 Secrets 與 official-daily.yml 相同：DB_URL、DB_USERNAME、DB_PASSWORD
# 失敗或資料檢查發現異常時 GitHub 會寄信通知；資料檢查結果顯示在執行頁面的 Summary

name: 行情每日更新

on:
  schedule:
    # GitHub 的排程時間是 UTC，以下換算為台灣時間（UTC+8），週一到週五（休市日執行不會出錯，結果維持前一個交易日）。
    # Mac 排程 15:00 開始、約 15:10 結束（2026-11 實測主程式約 6 分鐘）；並行期間錯開，避免兩邊同時寫入交易計畫。
    # 排程可能延遲或偶爾被略過，所以排兩次，第二次作為備援（重複執行只會更新、不會產生重複資料）。
    - cron: "40 7 * * 1-5"   # 台灣時間 15:40
    - cron: "10 10 * * 1-5"  # 台灣時間 18:10（備援）
  workflow_dispatch:           # Actions 頁面的「Run workflow」按鈕，可隨時手動執行

permissions:
  contents: read               # 只讀取程式碼，不寫回任何 repo

concurrency:
  group: market-daily          # 同時只跑一個（例如手動執行與排程重疊時，後來的會等前一個結束）
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Taipei          # log 時間與「今天」的判斷使用台灣時間
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: 取出程式碼（公開 repo）
        uses: actions/checkout@v7
        with:
          repository: kevinrockpig/stock-tracker-system
          ref: main
          path: code
          persist-credentials: false   # 程式碼 repo 只需讀取

      - name: 安裝 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/stock-scraper-python/requirements.txt

      - name: 安裝套件
        working-directory: code/stock-scraper-python
        run: pip install -r requirements.txt

      - name: 更新行情、指標、策略、回測、交易計畫與參考價位
        working-directory: code/stock-scraper-python
        run: python -m scraper.main

      # 上一步部分股票失敗時仍會執行，檢查已寫入的資料；結果同時寫進執行頁面的 Summary
      - name: 資料健康檢查
        if: ${{ !cancelled() }}
        working-directory: code/stock-scraper-python
        run: |
          set +e
          python -m scraper.health 2>&1 | tee health.log
          status=${PIPESTATUS[0]}
          {
            echo "### 資料健康檢查（exit ${status}）"
            echo '```'
            cat health.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"
